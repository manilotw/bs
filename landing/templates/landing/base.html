{% load static assets %}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Удобные отчёты для бухгалтера в 1С{% endblock %}</title>
  <meta name="description" content="Отчёты 1-ТС, 2-МП, ЭСФ, ГТД, Банк-клиент и др.">
  <meta name="keywords" content="1-ТС, 2-МП, ЭСФ, банк клиент 1С">
  <meta property="og:url" content="{{ SITE_URL }}">
  <meta property="og:title" content="ВЦ Интеграция: удобные отчёты">
  <meta property="og:description" content="автоматизация 1-ТС, 2-МП, ЭСФ, ЭГТД, Табель и др.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ SITE_URL }}{% static 'landing/img/og-logo.png' %}">
  <link rel="canonical" href="{{ SITE_URL }}">
  <meta name="format-detection" content="telephone=no">
  <link rel="shortcut icon" href="{% static 'landing/img/favicon.ico' %}" type="image/x-icon">
  <link rel="apple-touch-icon" href="{% static 'landing/img/apple-touch-icon.png' %}">
  <link rel="apple-touch-icon" sizes="76x76" href="{% static 'landing/img/apple-touch-icon.png' %}">
  <link rel="apple-touch-icon" sizes="152x152" href="{% static 'landing/img/apple-touch-icon.png' %}">
  <link rel="apple-touch-startup-image" href="{% static 'landing/img/apple-touch-icon.png' %}">
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-TileImage" content="{% static 'landing/img/ms-tile.png' %}">

  <link rel="preload" href="{% static 'landing/fonts/FuturaPT-600.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'landing/fonts/FuturaPT-500.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% asset 'landing/css/fonts.css' %}">
  <link rel="stylesheet" href="{% asset 'landing/css/site.css' %}">
  <link rel="stylesheet" href="{% asset 'landing/css/zero.css' %}">
</head>
<body>
  <div class="page" id="page">
    {% block content %}{% endblock %}
  </div>

  {% block popups %}{% endblock %}

  <script src="{% asset 'landing/js/zero.js' %}"></script>
  <script src="{% asset 'landing/js/site.js' %}" defer></script>

  {% include "landing/partials/analytics.html" %}
</body>
</html>
